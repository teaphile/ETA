# =============================================================================
# Exam Travel Assist — nginx server block
# -----------------------------------------------------------------------------
# Install to /etc/nginx/sites-available/exam-travel-assist and symlink into
# sites-enabled. Replace DOMAIN and the PHP-FPM socket path for your PHP version.
#
#   sudo ln -s /etc/nginx/sites-available/exam-travel-assist /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS certificates: use certbot (Let's Encrypt):
#   sudo certbot --nginx -d your-domain.example
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Absolute path to the app's public/ directory.
    root /var/www/exam-travel-assist/public;
    index index.php;

    charset utf-8;
    client_max_body_size 8M;   # CSV imports are capped at 5 MB in the app

    # Security headers (the app also sets these; nginx duplicates defensively).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never expose dot-files.
    location ~ /\.(?!well-known).* { deny all; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # adjust to your PHP version
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    # Static assets served directly with long cache.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    # Deny access to application internals if the root is ever misconfigured.
    location ~ ^/(storage|vendor|bootstrap|config|database|routes|tests)/ {
        deny all;
    }
}
