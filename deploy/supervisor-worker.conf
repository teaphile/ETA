; =============================================================================
; Exam Travel Assist — queue worker (Supervisor)
; -----------------------------------------------------------------------------
; Install to /etc/supervisor/conf.d/exam-travel-assist-worker.conf
; then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Only needed if you enable queued jobs (queued mail/notifications).
; =============================================================================

[program:exam-travel-assist-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/exam-travel-assist/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/exam-travel-assist/storage/logs/worker.log
stopwaitsecs=3600
