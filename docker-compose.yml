Services:
  app:
    image: php:8.4-cli
    working_dir: /var/www
    volumes: [".:/var/www"]
    command: bash -c "apt-get update && apt-get install -y libzip-dev unzip && docker-php-ext-install pdo_mysql zip && php -S 0.0.0.0:8000 -t public"
    ports: ["8000:8000"]
    environment: { DB_CONNECTION: mysql, DB_HOST: db, DB_DATABASE: examtravel, DB_USERNAME: exam, DB_PASSWORD: secret }
    depends_on: [db]
  db:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: rootsecret, MYSQL_DATABASE: examtravel, MYSQL_USER: exam, MYSQL_PASSWORD: secret }
    ports: ["3306:3306"]
    volumes: ["dbdata:/var/lib/mysql"]
volumes: { dbdata: {} }
